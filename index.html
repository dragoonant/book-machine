<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16123a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Book Machine" />
    <title>Book Machine</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" class="brand-icon" />
        <span class="brand-name">Book Machine</span>
      </div>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        <input id="searchInput" type="search" placeholder="Find a book… try “bears” or “Oz”" autocomplete="off" enterkeyhint="search" />
        <button type="button" id="searchClear" class="search-clear" hidden aria-label="Clear search">×</button>
      </form>
    </header>

    <main id="home">
      <section class="hero" id="hero" aria-live="polite"></section>
      <div id="rows"></div>
    </main>

    <main id="results" hidden>
      <h2 class="results-title" id="resultsTitle"></h2>
      <div class="grid" id="resultsGrid"></div>
    </main>

    <!-- Book details -->
    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <button class="icon-btn sheet-close" id="sheetClose" aria-label="Close">×</button>
        <img class="sheet-cover" id="sheetCover" alt="" />
        <div class="sheet-body">
          <h2 id="sheetTitle"></h2>
          <p class="sheet-meta" id="sheetMeta"></p>
          <div class="sheet-progress" id="sheetProgress" hidden><span></span></div>
          <div class="sheet-actions">
            <button class="btn btn-primary" id="sheetRead">▶ Read</button>
            <button class="btn btn-ghost" id="sheetSave"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reader -->
    <div class="reader" id="reader" hidden>
      <div class="reader-top">
        <button class="icon-btn" id="readerClose" aria-label="Close book">✕</button>
        <div class="reader-title" id="readerTitle"></div>
        <button class="icon-btn" id="readerSave" aria-label="Save to My Books">♡</button>
      </div>
      <div class="reader-stage" id="stage">
        <div class="track" id="track">
          <div class="slot"><img alt="" draggable="false" /></div>
          <div class="slot"><img alt="" draggable="false" /></div>
          <div class="slot"><img alt="" draggable="false" /></div>
        </div>
        <div class="spinner" id="spinner" hidden></div>
        <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous page">‹</button>
        <button class="nav-btn nav-next" id="nextBtn" aria-label="Next page">›</button>
      </div>
      <div class="reader-bottom">
        <input type="range" id="pageSlider" min="0" value="0" aria-label="Go to page" />
        <span class="page-label" id="pageLabel"></span>
      </div>
      <div class="the-end" id="theEnd" hidden>
        <div class="the-end-card">
          <div class="stars">★ ★ ★</div>
          <h2>The End!</h2>
          <p id="theEndText">You finished a book!</p>
          <div class="sheet-actions">
            <button class="btn btn-primary" id="endPick">Pick another book</button>
            <button class="btn btn-ghost" id="endAgain">Read it again</button>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="ia.js"></script>
    <script src="library.js"></script>
    <script src="reader.js"></script>
    <script src="app.js"></script>
  </body>
</html>
